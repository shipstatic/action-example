# Deploy behind a password — visitors must unlock before viewing.
#
# Works with or without an account. One-time setup: in this repository open
# Settings → Secrets and variables → Actions → "New repository secret".
# Name it SHIP_PASSWORD and choose a password of 6 to 128 characters.
name: Deploy

# Run whenever commits land on the main branch.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out your repository so the workflow can read your files.
      - uses: actions/checkout@v7

      # This demo is a Vite app, so it builds first. If your site is a plain
      # folder of files, delete this line.
      - run: npm ci && npm run build

      - uses: shipstatic/action@v2
        with:
          # The folder to publish.
          path: ./dist
          # Read from the secret so the password never appears in this file
          # or in the run's logs.
          password: ${{ secrets.SHIP_PASSWORD }}
